<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fa" />
    <title>智能门禁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="ring-container state-idle" id="ring-container">
        <!-- Outer status indicator ring -->
        <div class="ring-outer"></div>
        
        <!-- Duolingo style 3D button -->
        <button class="duo-button" id="open-door" type="button" aria-label="点击开门">
          <div class="button-content">
            <svg class="button-icon" id="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- Key Icon -->
              <circle cx="7.5" cy="15.5" r="4.5" />
              <path d="m10.7 12.3 8.3-8.3" />
              <path d="M16 7h3" />
              <path d="M19 4h2v3" />
            </svg>
            <span class="button-label" id="button-label">开门</span>
          </div>
        </button>
      </div>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
